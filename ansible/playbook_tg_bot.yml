---
- name: Deploy PostgreSQL Primary
  hosts: db_primary
  become: yes
  vars:
    db_password: "123"
    replica_password: "123"
  tasks:
    - name: Ensure PostgreSQL is running
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Create database task_bot
      postgresql_db:
        name: task_bot
      become_user: postgres

    - name: Create user for bot
      postgresql_user:
        name: postgres
        password: "{{ db_password }}"
        role_attr_flags: LOGIN
        state: present
      become_user: postgres

    - name: Create replication user
      postgresql_user:
        name: replicator
        password: "{{ replica_password }}"
        role_attr_flags: REPLICATION,LOGIN
        state: present
      become_user: postgres

    - name: Create tables for bot
      postgresql_query:
        db: task_bot
        query: |
          CREATE TABLE IF NOT EXISTS emails (
              id SERIAL PRIMARY KEY,
              email VARCHAR(255) NOT NULL UNIQUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS phones (
              id SERIAL PRIMARY KEY,
              phone VARCHAR(50) NOT NULL UNIQUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO task_bot_user;
          GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO task_bot_user;
      become_user: postgres

- name: Deploy PostgreSQL Replica
  hosts: db_replica
  become: yes
  vars:
    replica_password: "123"
  tasks:
    - name: Install Python psycopg2 for PostgreSQL
      apt:
        name: python3-psycopg2
        state: present

    - name: Install PostgreSQL
      apt:
        name: postgresql
        state: present
        update_cache: yes

    - name: Stop PostgreSQL
      service:
        name: postgresql
        state: stopped

    - name: Remove old data directory
      file:
        path: /var/lib/postgresql/17/main
        state: absent

    - name: Create data directory
      file:
        path: /var/lib/postgresql/17/main
        state: directory
        owner: postgres
        group: postgres
        mode: 0700

    - name: Copy pgpass file
      copy:
        src: pgpass
        dest: /var/lib/postgresql/.pgpass
        owner: postgres
        group: postgres
        mode: 0600

    - name: Take base backup from primary
      command: >
        pg_basebackup -h {{ hostvars['db1']['ansible_host'] }}
        -U replicator -D /var/lib/postgresql/17/main
        -Fp -Xs -P -R
      become_user: postgres

    - name: Start PostgreSQL replica
      service:
        name: postgresql
        state: started
        enabled: yes

- name: Deploy Telegram Bot
  hosts: bot
  become: yes
  vars:
    bot_token: "8958995483:AAETDy1MKE9E9F-V1aPCooP9Hgtlj9QcZSY"
    db_password: "123"
  tasks:
    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - mc
        state: present
        update_cache: yes

    - name: Clone repository from GitHub
      git:
        repo: https://github.com/vndecipherable/devops_bot.git
        dest: /opt/devops_bot
        version: docker

    - name: Install Python requirements in virtual environment
      pip:
        requirements: /opt/devops_bot/bot/requirements.txt
        virtualenv: /opt/devops_bot/venv
        virtualenv_command: python3 -m venv

    - name: Create .env file for bot
      copy:
        dest: /opt/devops_bot/bot/.env
        content: |
          BOT_TOKEN={{ bot_token }}
          DB_NAME=task_bot
          DB_USER=postgres
          DB_PASSWORD={{ db_password }}
          DB_HOST={{ hostvars['db1']['ansible_host'] }}
          DB_PORT=5432
          LOG_PATH=/var/log/postgresql/postgresql-17-main.log
          MASTER_IP={{ hostvars['db1']['ansible_host'] }}

    - name: Start bot in background with virtual environment
      shell:
        cmd: |
          cd /opt/devops_bot/bot
          source /opt/devops_bot/venv/bin/activate
          nohup python3 bot.py > /tmp/bot.log 2>&1 &
        executable: /bin/bash
